[package]
name = "zeren"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Shared by both binaries; the UI is referenced only by `zeren`, so the
# background engine links without it.
[lib]
name = "zeren_app"
path = "src/lib.rs"

[[bin]]
name = "zeren"
path = "src/main.rs"

[[bin]]
name = "zeren-engine"
path = "src/bin/zeren-engine.rs"

[dependencies]
zeren-engine.workspace = true
zeren-harness.workspace = true
zeren-rpc.workspace = true
zeren-ui.workspace = true
zeren-update.workspace = true
zeren-cli.workspace = true
zeren-mcp.workspace = true
zeren-notify.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
libc.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The custom allocator is macOS-only (see main.rs): glibc measured flat on the
# same streaming/scroll workloads, so Linux keeps the system allocator.
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
embed-resource = "3.0.11"
