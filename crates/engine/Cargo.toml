[package]
name = "zeren-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zeren-launch.workspace = true
# Host-side answers to terminal queries (terminals/replies.rs).
alacritty_terminal.workspace = true
zeren-preview.workspace = true
zeren-proto.workspace = true
zeren-theme.workspace = true
zeren-doc.workspace = true
zeren-sync.workspace = true
zeren-harness.workspace = true
semver = "1"
zeren-rpc.workspace = true
zeren-update.workspace = true
zeren-notify.workspace = true
zeren-visual.workspace = true
# Plugin services (plugins/service): a headless Luau VM per plugin, the
# same mlua and Luau zeren-visual already links (no new crate).
mlua = { version = "0.12", features = ["luau"] }
loro.workspace = true
tokio.workspace = true
futures.workspace = true
zeren-term-link.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"
# Cloud runner identity: Ed25519 device key (already in the tree via rustls).
ring = "0.17"
toml = "0.8"
libc.workspace = true
gethostname.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
sha2.workspace = true
reqwest.workspace = true
# The rules plugins are held to (paths, programs, network), shared with apps/zgx.
zeren-plugin-guard.workspace = true
ignore.workspace = true
fff-search.workspace = true

same-file = "1"
tempfile.workspace = true
# `show_image` reads a shown image's size from its header (already in the
# tree with these decoders via zeren-ui).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tracing-subscriber.workspace = true
zeren-mcp.workspace = true
zeren-harness = { workspace = true, features = ["installer-fixture"] }
# Paused-clock tests (the 30-minute idle reaper).
tokio = { workspace = true, features = ["test-util"] }
zip.workspace = true
tokio-tungstenite.workspace = true
# A registry build of the fake ACP agent (tests/acp_registry_rpc.rs).
tar = "0.4"
flate2 = "1"
# In-process registry server for the two-engine workspace integration tests.
zeren-sync = { workspace = true, features = ["mock-server"] }
