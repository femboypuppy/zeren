[package]
name = "zeren-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The mobile core: one UniFFI library that iOS (Swift) and Android (Kotlin)
# link. Platform code paints, scrolls and handles gestures; everything that
# decides *what* to paint and *where* lives here.
[lib]
name = "zeren_mobile"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
zeren-voice-session.workspace = true
zeren-orb.workspace = true
zeren-veil.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
uniffi = "0.32"
zeren-markdown.workspace = true
zeren-text.workspace = true
zeren-doc.workspace = true
zeren-proto.workspace = true
zeren-client.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
zeren-syntax.workspace = true
thiserror.workspace = true
